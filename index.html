<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Defect & Pothole Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      <h1>Road Defect Mapper</h1>
    </div>
    <div class="header-right">
      <div class="status-badge" id="connStatus">Connecting...</div>
    </div>
  </header>

  <div class="telemetry-bar">
    <div class="telemetry-item">
      <span class="label">GPS Fix</span>
      <span class="val" id="gpsStatus">Waiting for GPS</span>
    </div>
    <div class="telemetry-item">
      <span class="label">Coordinates</span>
      <span class="val" id="coords">--</span>
    </div>
    <div class="telemetry-item">
      <span class="label">Speed</span>
      <span class="val" id="speed">0.0 km/h</span>
    </div>
    <div class="telemetry-item">
      <span class="label">Battery</span>
      <span class="val" id="battery">--%</span>
    </div>
    <div class="telemetry-item">
      <span class="label">Total Hazards</span>
      <span class="val highlight" id="issueCount">0</span>
    </div>
    <button class="btn-action" id="btnTrigger">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <span>Manual Flag</span>
    </button>
  </div>

  <main class="main-layout">
    <div id="map"></div>
    
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Detected Road Defects</h2>
        <span class="live-pill">LIVE</span>
      </div>
      <div id="issuesList" class="issues-list">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
          <p>No defects recorded yet.<br>Start your ride to detect road issues.</p>
        </div>
      </div>
    </aside>
  </main>

  <!-- Image Modal -->
  <div id="imgModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="modalClose">&times;</span>
      <img id="modalImg" src="" alt="Issue Snapshot" />
      <div id="modalDetails" class="modal-details"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
